name: CampeNEWS Supadata Tests
on:
  push:
    branches: [campe-news-dashboard]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Android interface, session and SRT import
        run: node campe-board/test.js
      - name: Validate Supadata transcript and asynchronous jobs
        run: node campe-board/test-supadata.js
