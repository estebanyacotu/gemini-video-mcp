name: CampeNEWS tablero tests
on:
  push:
    branches: [campe-news-dashboard]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate UI, SRT and private extraction API
        run: node campe-board/test.js
      - name: Validate autonomous audio recognition fallback
        run: node campe-board/test-auto.js
      - name: Verify Gemini 3.8 priority and fallback to 3.6
        run: node campe-board/test-gemini-models.js
      - name: Validate full private extraction job from URL to ranked clips
        run: node campe-board/test-jobs.js
  remote-captions-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe YouTube external caption availability (nonblocking)
        timeout-minutes: 5
        run: node campe-board/integration.js
