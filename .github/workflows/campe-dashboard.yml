name: CampeNEWS tablero tests
on:
  push:
    branches: [campe-news-dashboard]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify SRT parsing, clip mining, UI and authenticated API
        run: node campe-board/test.js
      - name: Verify real YouTube live against transcriptor MCP
        timeout-minutes: 5
        run: node campe-board/integration.js
